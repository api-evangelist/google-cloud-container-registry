name: Google Cloud Container Registry
description: >-
  Google Cloud Container Registry is a private Docker image storage service on
  Google Cloud Platform. It provides secure, private Docker image storage with
  integration into Google Cloud CI/CD pipelines, vulnerability scanning, and
  access control. Note that Container Registry has been superseded by Artifact
  Registry as the recommended container registry for Google Cloud.
