  - Registries
  - Storage
  - CI/CD
  - Google Cloud
apis:
  - name: Google Cloud Container Registry API
    description: >-
      The Container Registry API provides access to store, manage, and secure
      Docker container images. It supports pushing and pulling images, managing
      image tags, and integrating with vulnerability scanning and binary
      authorization services.
    humanURL: https://cloud.google.com/container-registry/docs
    baseURL: https://containerregistry.googleapis.com
    properties:
      - type: OpenAPI
        url: openapi/openapi.yml
      - type: JSONSchema
