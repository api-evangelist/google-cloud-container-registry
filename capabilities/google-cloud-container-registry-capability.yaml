naftiko: 1.0.0-alpha2
info:
  label: Google Cloud Container Registry API
  description: The Container Registry API provides access to store, manage, and secure Docker container images. It supports
    pushing and pulling images, managing image tags, and integrating with vulnerability scanning and binary authorization
    services.
  tags:
  - Google
  - Cloud
  - Container
  - Registry
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: google-cloud-container-registry
    baseUri: https://containerregistry.googleapis.com
    description: Google Cloud Container Registry API HTTP API.
    resources:
    - name: v2-name-tags-list
      path: /v2/{name}/tags/list
      operations:
      - name: listtags
        method: GET
        description: Google Cloud Container Registry List Image Tags
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
          description: The name of the image.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v2-name-manifests-reference
      path: /v2/{name}/manifests/{reference}
      operations:
      - name: getmanifest
        method: GET
        description: Google Cloud Container Registry Get Image Manifest
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
        - name: reference
          in: path
          type: string
          required: true
          description: The tag or digest of the image.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: putmanifest
        method: PUT
        description: Google Cloud Container Registry Push Image Manifest
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
        - name: reference
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deletemanifest
        method: DELETE
        description: Google Cloud Container Registry Delete Image Manifest
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
        - name: reference
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v2-catalog
      path: /v2/_catalog
      operations:
      - name: listcatalog
        method: GET
        description: Google Cloud Container Registry List Repositories
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v2-name-blobs-digest
      path: /v2/{name}/blobs/{digest}
      operations:
      - name: getblob
        method: GET
        description: Google Cloud Container Registry Get Image Blob
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
        - name: digest
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: google-cloud-container-registry-rest
    description: REST adapter for Google Cloud Container Registry API.
    resources:
    - path: /v2/{name}/tags/list
      name: listtags
      operations:
      - method: GET
        name: listtags
        description: Google Cloud Container Registry List Image Tags
        call: google-cloud-container-registry.listtags
        with:
          name: rest.name
        outputParameters:
        - type: object
          mapping: $.
    - path: /v2/{name}/manifests/{reference}
      name: getmanifest
      operations:
      - method: GET
        name: getmanifest
        description: Google Cloud Container Registry Get Image Manifest
        call: google-cloud-container-registry.getmanifest
        with:
          name: rest.name
          reference: rest.reference
        outputParameters:
        - type: object
          mapping: $.
    - path: /v2/{name}/manifests/{reference}
      name: putmanifest
      operations:
      - method: PUT
        name: putmanifest
        description: Google Cloud Container Registry Push Image Manifest
        call: google-cloud-container-registry.putmanifest
        with:
          name: rest.name
          reference: rest.reference
        outputParameters:
        - type: object
          mapping: $.
    - path: /v2/{name}/manifests/{reference}
      name: deletemanifest
      operations:
      - method: DELETE
        name: deletemanifest
        description: Google Cloud Container Registry Delete Image Manifest
        call: google-cloud-container-registry.deletemanifest
        with:
          name: rest.name
          reference: rest.reference
        outputParameters:
        - type: object
          mapping: $.
    - path: /v2/_catalog
      name: listcatalog
      operations:
      - method: GET
        name: listcatalog
        description: Google Cloud Container Registry List Repositories
        call: google-cloud-container-registry.listcatalog
        outputParameters:
        - type: object
          mapping: $.
    - path: /v2/{name}/blobs/{digest}
      name: getblob
      operations:
      - method: GET
        name: getblob
        description: Google Cloud Container Registry Get Image Blob
        call: google-cloud-container-registry.getblob
        with:
          name: rest.name
          digest: rest.digest
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: google-cloud-container-registry-mcp
    transport: http
    description: MCP adapter for Google Cloud Container Registry API for AI agent use.
    tools:
    - name: listtags
      description: Google Cloud Container Registry List Image Tags
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-cloud-container-registry.listtags
      with:
        name: tools.name
      inputParameters:
      - name: name
        type: string
        description: The name of the image.
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: getmanifest
      description: Google Cloud Container Registry Get Image Manifest
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-cloud-container-registry.getmanifest
      with:
        name: tools.name
        reference: tools.reference
      inputParameters:
      - name: name
        type: string
        description: name
        required: true
      - name: reference
        type: string
        description: The tag or digest of the image.
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: putmanifest
      description: Google Cloud Container Registry Push Image Manifest
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: google-cloud-container-registry.putmanifest
      with:
        name: tools.name
        reference: tools.reference
      inputParameters:
      - name: name
        type: string
        description: name
        required: true
      - name: reference
        type: string
        description: reference
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: deletemanifest
      description: Google Cloud Container Registry Delete Image Manifest
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: google-cloud-container-registry.deletemanifest
      with:
        name: tools.name
        reference: tools.reference
      inputParameters:
      - name: name
        type: string
        description: name
        required: true
      - name: reference
        type: string
        description: reference
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: listcatalog
      description: Google Cloud Container Registry List Repositories
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-cloud-container-registry.listcatalog
      outputParameters:
      - type: object
        mapping: $.
    - name: getblob
      description: Google Cloud Container Registry Get Image Blob
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-cloud-container-registry.getblob
      with:
        name: tools.name
        digest: tools.digest
      inputParameters:
      - name: name
        type: string
        description: name
        required: true
      - name: digest
        type: string
        description: digest
        required: true
      outputParameters:
      - type: object
        mapping: $.
